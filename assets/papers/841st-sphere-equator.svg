<svg xmlns="http://www.w3.org/2000/svg" width="460" height="230" viewBox="0 0 460 230" role="img" aria-labelledby="t d"><title id="t">The equator of a 48-system: angles before and after the skew</title><desc id="d">Two rows of angle marks. Top: the 16 equator points in the tesseract position, with angles 60, 90, 120 and 180 degrees. Bottom: the skewed Clebsch position of the paper, with angles 70.53, 83.62, 123.75 and 141.06 degrees. Dotted curves join corresponding pairs; the numbers are pairs per equator point.</desc><style>@font-face{font-family:PlateMono;font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:PlateSans;font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:PlateSans;font-weight:500;font-style:normal;src:url(data:font/woff;base64,) format('woff')}text{font-kerning:normal}</style><rect width="460" height="230" fill="#e2e8ee"/><text x="16" y="18" font-size="12" fill="#15202b" text-anchor="start"><tspan font-family="PlateSans, 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-style="normal">tesseract position</tspan><tspan font-family="PlateMono, 'IBM Plex Mono', Menlo, Consolas, monospace" font-weight="400" font-style="normal">  q₅ = 0</tspan></text><text x="444" y="18" font-size="12" fill="#d45d27" text-anchor="end"><tspan font-family="PlateSans, 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-style="normal">skewed Clebsch</tspan><tspan font-family="PlateMono, 'IBM Plex Mono', Menlo, Consolas, monospace" font-weight="400" font-style="normal">  q₅ = 1/9</tspan></text><line x1="16" y1="76" x2="444" y2="76" stroke="#15202b" stroke-width="1" stroke-linecap="round"/><line x1="16" y1="158" x2="444" y2="158" stroke="#15202b" stroke-width="1" stroke-linecap="round"/><path d="M47.7 76 C47.7 111.0 81.08 123.0 81.08 140" fill="none" stroke="#536171" stroke-width="1" stroke-linejoin="round" stroke-linecap="ro